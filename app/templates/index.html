<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vozario Web</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="/static/vozario-mark.svg" alt="" class="brand__mark" />
          <div>
            <p class="eyebrow">Vozario Web</p>
            <h1>Transcripcion en la nube</h1>
          </div>
        </div>

        <section class="upload-card">
          <label class="dropzone" id="dropzone">
            <input id="fileInput" type="file" accept=".mp3,.mp4,.wav,.flac,.ogg,.amr,.webm,.m4a,video/*,audio/*" />
            <span class="dropzone__icon">+</span>
            <span class="dropzone__title">Elegir video o audio</span>
            <span class="dropzone__hint">Hasta {{ max_upload_mb }} MB</span>
          </label>

          <label class="field">
            <span>Titulo</span>
            <input id="titleInput" type="text" placeholder="Nombre de la transcripcion" />
          </label>

          <div class="field-grid">
            <label class="field">
              <span>Idioma</span>
              <select id="languageInput">
                <option value="es-ES">Espanol</option>
                <option value="auto">Detectar solo</option>
                <option value="es-US">Espanol latino</option>
                <option value="en-US">Ingles</option>
              </select>
            </label>

            <label class="toggle">
              <input id="speakerInput" type="checkbox" />
              <span>Separar voces</span>
            </label>
          </div>

          <button class="primary" id="uploadButton" type="button">Subir y transcribir</button>

          <div class="progress" aria-live="polite">
            <div class="progress__bar"><span id="progressBar"></span></div>
            <p id="progressLabel">Listo para subir.</p>
          </div>

          {% if not has_bucket %}
          <p class="warning">Falta configurar VOZARIO_S3_BUCKET en el servidor.</p>
          {% endif %}
        </section>

        <section class="library">
          <div class="section-title">
            <span>Archivo</span>
            <button id="refreshButton" type="button">Actualizar</button>
          </div>
          <div id="jobList" class="job-list"></div>
        </section>
      </aside>

      <section class="workspace">
        <div class="viewer-card">
          <div class="viewer-head">
            <div>
              <p class="eyebrow">Resultado</p>
              <h2 id="currentTitle">Elegí una transcripcion</h2>
            </div>
            <div class="actions">
              <a id="txtDownload" class="ghost disabled" href="#">TXT</a>
              <a id="srtDownload" class="ghost disabled" href="#">SRT</a>
            </div>
          </div>

          <div class="player-grid">
            <div class="video-panel">
              <video id="video" controls playsinline></video>
              <div class="empty-video" id="emptyVideo">El video aparece aca cuando el trabajo termina.</div>
            </div>
            <aside class="transcript-panel">
              <div class="search-row">
                <input id="searchInput" type="search" placeholder="Buscar dentro de la transcripcion" />
                <button id="clearSearch" type="button">Limpiar</button>
              </div>
              <div id="transcript" class="transcript"></div>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
